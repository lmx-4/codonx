[package]
name = "codonx"
version = "0.0.6"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Codon-first dual-target preprocessor: Python debug target and Codon release target."
readme = "README.md"
documentation = "https://docs.rs/codonx"
keywords = ["codon", "python", "preprocessor", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["Cargo.toml.orig"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
